<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Chris Voice</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111827;
      color: white;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 8px;
    }

    p {
      color: #9ca3af;
      line-height: 1.5;
    }

    .drive-button {
      margin-top: 25px;
      padding: 14px 22px;
      border: 1px solid #374151;
      border-radius: 10px;
      background: #1f2937;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    .drive-button:hover {
      background: #374151;
    }

    .drive-status {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #9ca3af;
      min-height: 22px;
    }

    .record-button {
      margin-top: 35px;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: none;
      background: #dc2626;
      color: white;
      font-size: 1.4rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      transition: transform 0.15s ease;
    }

    .record-button:active {
      transform: scale(0.95);
    }

    .record-button.recording {
      background: #7f1d1d;
      animation: pulse 1.5s infinite;
    }

    .record-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      animation: none;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7);
      }

      70% {
        box-shadow: 0 0 0 25px rgba(220, 38, 38, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(220, 38, 38, 0);
      }
    }

    #status {
      margin-top: 25px;
      font-size: 1rem;
      color: #d1d5db;
      min-height: 24px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Chris Voice</h1>

    <p>
      Your private voice brain-dump recorder.
    </p>

    <button id="driveButton" class="drive-button">
      Connect Google Drive
    </button>

    <div id="driveStatus" class="drive-status">
      Google Drive not connected.
    </div>

    <button id="recordButton" class="record-button" disabled>
      RECORD
    </button>

    <div id="status">
      Connect Google Drive to begin.
    </div>

  </div>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client"></script>

  <script>

    // ============================================================
    // CONFIGURATION
    // ============================================================

    const CLIENT_ID =
      "106680748495-5hpkrg09pnon2nu5olce73et8e376emh.apps.googleusercontent.com";

    const DRIVE_SCOPE =
      "https://www.googleapis.com/auth/drive.file";

    const APP_FOLDER_NAME = "Chris Voice Notes";
    const INBOX_FOLDER_NAME = "00 - INBOX";


    // ============================================================
    // STATE
    // ============================================================

    let accessToken = null;
    let tokenClient = null;

    let recorder = null;
    let mediaStream = null;
    let audioChunks = [];

    let inboxFolderId = null;


    // ============================================================
    // ELEMENTS
    // ============================================================

    const driveButton = document.getElementById("driveButton");
    const driveStatus = document.getElementById("driveStatus");
    const recordButton = document.getElementById("recordButton");
    const status = document.getElementById("status");


    // ============================================================
    // GOOGLE AUTHENTICATION
    // ============================================================

    window.addEventListener("load", () => {

      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: DRIVE_SCOPE,

        callback: async (response) => {

          if (response.error) {
            console.error(response);
            driveStatus.textContent =
              "Google Drive connection failed.";
            return;
          }

          accessToken = response.access_token;

          driveStatus.textContent =
            "Connected to Google Drive.";

          driveButton.textContent =
            "Google Drive Connected";

          recordButton.disabled = false;

          status.textContent =
            "Preparing your recording folder...";

          try {

            await setupDriveFolders();

            status.textContent =
              "Ready. Press RECORD.";

          } catch (error) {

            console.error(error);

            status.textContent =
              "Connected, but couldn't prepare the Drive folder.";

          }

        }
      });

    });


    driveButton.addEventListener("click", () => {

      if (!tokenClient) {
        driveStatus.textContent =
          "Google authentication is still loading.";
        return;
      }

      tokenClient.requestAccessToken({
        prompt: "consent"
      });

    });


    // ============================================================
    // DRIVE API HELPER
    // ============================================================

    async function driveRequest(url, options = {}) {

      const headers = options.headers || {};

      headers["Authorization"] =
        "Bearer " + accessToken;

      options.headers = headers;

      const response = await fetch(url, options);

      if (!response.ok) {

        const errorText = await response.text();

        throw new Error(
          `Drive API error ${response.status}: ${errorText}`
        );

      }

      return response;

    }


    // ============================================================
    // CREATE OUR DRIVE FOLDERS
    // ============================================================

    async function createFolder(name, parentId = null) {

      const metadata = {
        name: name,
        mimeType: "application/vnd.google-apps.folder"
      };

      if (parentId) {
        metadata.parents = [parentId];
      }

      const response = await driveRequest(
        "https://www.googleapis.com/drive/v3/files",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(metadata)
        }
      );

      return await response.json();

    }


    async function setupDriveFolders() {

      // We intentionally create the folders ourselves.
      // This works cleanly with the narrow drive.file permission.

      const appFolder =
        await createFolder(APP_FOLDER_NAME);

      const inboxFolder =
        await createFolder(
          INBOX_FOLDER_NAME,
          appFolder.id
        );

      inboxFolderId = inboxFolder.id;

      localStorage.setItem(
        "chrisVoiceInboxFolderId",
        inboxFolderId
      );

    }


    // ============================================================
    // RECORDING
    // ============================================================

    recordButton.addEventListener("click", async () => {

      if (!recorder || recorder.state === "inactive") {

        await startRecording();

      } else {

        stopRecording();

      }

    });


    async function startRecording() {

      try {

        mediaStream =
          await navigator.mediaDevices.getUserMedia({
            audio: true
          });

        audioChunks = [];

        const mimeTypes = [
          "audio/webm;codecs=opus",
          "audio/webm",
          "audio/mp4"
        ];

        let selectedMimeType = "";

        for (const type of mimeTypes) {

          if (MediaRecorder.isTypeSupported(type)) {
            selectedMimeType = type;
            break;
          }

        }

        if (!selectedMimeType) {
          throw new Error(
            "This browser does not support a compatible audio format."
          );
        }

        recorder = new MediaRecorder(
          mediaStream,
          {
            mimeType: selectedMimeType
          }
        );


        recorder.ondataavailable = (event) => {

          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }

        };


        recorder.onstart = () => {

          recordButton.textContent = "STOP";

          recordButton.classList.add("recording");

          status.textContent =
            "Recording...";

        };


        recorder.onstop = async () => {

          mediaStream
            .getTracks()
            .forEach(track => track.stop());

          const blob =
            new Blob(
              audioChunks,
              {
                type: recorder.mimeType
              }
            );

          recordButton.textContent =
            "RECORD";

          recordButton.classList.remove(
            "recording"
          );

          recordButton.disabled = true;

          status.textContent =
            "Uploading recording...";

          try {

            await uploadRecording(blob);

            status.textContent =
              "Uploaded successfully. Ready for another recording.";

          } catch (error) {

            console.error(error);

            status.textContent =
              "Recording finished, but upload failed.";

          }

          recordButton.disabled = false;

        };


        // Give us data periodically rather than waiting
        // until the very end of the recording.
        recorder.start(10000);

      } catch (error) {

        console.error(error);

        status.textContent =
          "Could not access the microphone.";

      }

    }


    function stopRecording() {

      if (
        recorder &&
        recorder.state !== "inactive"
      ) {

        recorder.stop();

      }

    }


    // ============================================================
    // UPLOAD TO GOOGLE DRIVE
    // ============================================================

    async function uploadRecording(blob) {

      if (!inboxFolderId) {

        throw new Error(
          "Drive inbox folder is not ready."
        );

      }


      const now = new Date();

      const timestamp =
        now.toISOString()
          .replace(/:/g, "-")
          .replace(/\..+/, "");

      let extension = ".webm";

      if (
        blob.type.includes("mp4")
      ) {
        extension = ".m4a";
      }

      const filename =
        `Voice Note ${timestamp}${extension}`;


      // Step 1: start a resumable upload

      const metadata = {
        name: filename,
        parents: [inboxFolderId],
        mimeType: blob.type
      };


      const startResponse =
        await driveRequest(
          "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json; charset=UTF-8",
              "X-Upload-Content-Type": blob.type,
              "X-Upload-Content-Length": String(blob.size)
            },
            body: JSON.stringify(metadata)
          }
        );


      const uploadUrl =
        startResponse.headers.get("Location");


      if (!uploadUrl) {

        throw new Error(
          "Google did not provide an upload URL."
        );

      }


      // Step 2: upload the actual audio

      const uploadResponse =
        await fetch(
          uploadUrl,
          {
            method: "PUT",
            headers: {
              "Content-Type": blob.type,
              "Content-Length": String(blob.size)
            },
            body: blob
          }
        );


      if (!uploadResponse.ok) {

        const errorText =
          await uploadResponse.text();

        throw new Error(
          `Upload failed ${uploadResponse.status}: ${errorText}`
        );

      }


      console.log(
        "Uploaded:",
        filename
      );

    }

  </script>

</body>
</html>
